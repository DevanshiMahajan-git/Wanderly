<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wanderly · Trip form</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="form-page"><main class="form-wrap"><a class="brand" href="/"><span class="brand-mark">w.</span> wanderly</a><a href="/" class="back">← Back to overview</a><div class="form-heading"><small class="eyebrow">✦ &nbsp; MAKE IT HAPPEN</small><h1 th:text="${formTitle}">Plan a new trip</h1><p>Every great adventure begins with a few little details.</p></div><form class="form-card" th:object="${trip}" th:action="${trip.id==null}?@{/trips}:@{/trips/{id}(id=${trip.id})}" method="post"><label>Trip name<input th:field="*{title}" placeholder="e.g. A little escape" required><small th:errors="*{title}"></small></label><label>Destination<input th:field="*{destination}" placeholder="e.g. Udaipur, India" required><small th:errors="*{destination}"></small></label><div class="two"><label>Departure<input type="date" id="startDate" th:field="*{startDate}" required><small th:errors="*{startDate}"></small></label><label>Return<input type="date" id="endDate" th:field="*{endDate}" required><small th:errors="*{endDate}"></small></label></div><div class="two"><label>Travellers<input type="number" th:field="*{travellers}" min="1" max="30" required></label><label>Status<select th:field="*{status}"><option th:each="s:${statuses}" th:value="${s}" th:text="${#strings.replace(s.name(),'_',' ')}"></option></select></label></div><label>Cover image URL <small>(optional)</small><input th:field="*{imageUrl}" placeholder="https://..."></label><label>Little notes for the journey <small>(optional)</small><textarea th:field="*{notes}" rows="3" placeholder="What are you most excited about?"></textarea></label><div class="form-buttons"><a href="/" class="cancel">Cancel</a><button class="button">Save itinerary ↗</button></div></form><p class="footnote">Your plans are saved locally in the Wanderly database.</p></main><script th:src="@{/js/app.js}"></script></body></html>
